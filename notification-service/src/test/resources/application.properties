spring.application.name=notification-service
server.port=8081

# --- H2 (in-memory) for unit tests, no running database required ---
spring.datasource.url=jdbc:h2:mem:notification_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Kafka ---
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.medflow.notificationservice.adapter.in.messaging.event.AppointmentEventPayload
spring.kafka.consumer.properties.spring.json.trusted.packages=com.medflow.notificationservice.adapter.in.messaging.event

# --- Topics ---
medflow.kafka.topic.appointment-events=medflow.appointment-events

# --- Notification message ---
medflow.notification.date-format=dd/MM/yyyy HH:mm
medflow.notification.date-locale=pt-BR
