spring.application.name=appointment-history-service
server.port=8082

# --- PostgreSQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appointment_history_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:medflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:medflow}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Schema is managed by infra/postgres-init (DDL), not Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Kafka ---
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=appointment-history-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.medflow.appointmenthistoryservice.adapter.in.messaging.event.AppointmentEventPayload
spring.kafka.consumer.properties.spring.json.trusted.packages=com.medflow.appointmenthistoryservice.adapter.in.messaging.event

# --- Topics ---
medflow.kafka.topic.appointment-events=medflow.appointment-events

# --- GraphQL ---
spring.graphql.graphiql.enabled=true
